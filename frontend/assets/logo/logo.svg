<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
    <defs>
        <!-- Shield Gradient -->
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="50%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#FFC300"/>
        </linearGradient>
        
        <!-- Text Gradient -->
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#818CF8"/>
            <stop offset="100%" stop-color="#FFC300"/>
        </linearGradient>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Logo Icon Group -->
    <g transform="translate(10, 10)">
        <!-- Outer Shield Badge -->
        <path d="M 50,5 Q 85,5 90,40 Q 90,80 50,98 Q 10,80 10,40 Q 15,5 50,5 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
        
        <!-- Inner Document & Checkmark Accent -->
        <path d="M 36,26 L 56,26 C 60,26 64,30 64,34 L 64,66 C 64,70 60,74 56,74 L 36,74 C 32,74 28,70 28,66 L 28,34 C 28,30 32,26 36,26 Z" fill="#000814" opacity="0.9"/>
        
        <!-- Document Lines -->
        <line x1="36" y1="36" x2="56" y2="36" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <line x1="36" y1="44" x2="52" y2="44" stroke="#FFFFFF" stroke-dasharray="1,1" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
        
        <!-- Vibrant Checkmark -->
        <path d="M 34,55 L 44,65 L 66,43" fill="none" stroke="#FFC300" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Brand Typography -->
    <text x="120" y="68" font-family="'Google Sans Flex', 'Montserrat', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
        Resu<tspan fill="url(#textGrad)">Match</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="122" y="90" font-family="'Google Sans Flex', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="1">
        ATS RESUME & CAREER ENGINE
    </text>
</svg>
